[package]
name = "vulkanize"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "vulkanize"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
vulkanize-gguf = { path = "../gguf" }
vulkanize-runtime = { path = "../runtime" }
vulkanize-api = { path = "../api" }
vulkanize-vulkan-backend = { path = "../vulkan-backend" }
ash = "0.37"
